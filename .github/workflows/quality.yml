name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-repo-guard:
    name: Public repository guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan tracked files
        shell: pwsh
        run: ./scripts/public_repo_guard.ps1 -AllTracked

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.1
      - name: Run unit tests
        working-directory: apps/android
        run: bash ./gradlew testDebugUnitTest --no-daemon
